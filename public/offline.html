<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6f62" />
    <title>暂时无法连接｜校区地址</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        color: #163c35;
        background: #f5f7f1;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 36px 30px;
        text-align: center;
        border: 1px solid #d9e3db;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(30, 76, 67, .12);
      }
      img { width: 76px; height: 76px; border-radius: 20px; }
      h1 { margin: 22px 0 10px; font-size: 24px; }
      p { margin: 0; color: #62756f; line-height: 1.7; }
      button {
        margin-top: 26px;
        min-width: 132px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: #0f6f62;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>暂时无法连接</h1>
      <p>请检查网络后重试。地图搜索和地址数据需要联网使用。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
